<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>OpenGame arcade</title>
  <style>
    :root{color-scheme:light;font-family:ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;background:var(--sky,#e7f7ef);color:#24372b;--sky:#e7f7ef;--field:#bde3b0;--accent:#7353d6;--accent-dark:#4f39a3}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;padding:clamp(10px,2vw,24px);background:linear-gradient(145deg,#e7f7ef,#d0ecdd)}
    .game-shell{width:min(100%,980px);border:4px solid #fff;border-radius:28px;padding:clamp(10px,2vw,18px);background:rgba(255,255,255,.72);box-shadow:0 20px 60px #477c6750}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 4px 12px}.brand{display:flex;align-items:center;gap:10px}.brand-mark{font-size:1.7rem;filter:drop-shadow(0 2px 0 #fff)}h1{font-size:clamp(1.1rem,3vw,1.5rem);margin:0;letter-spacing:-.03em}.sub{font-size:.78rem;color:#53715d;margin-top:2px}
    .stats{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.stat{background:#fff;border:1px solid #d8ead8;border-radius:999px;padding:6px 10px;font-size:.82rem;font-weight:800;white-space:nowrap}.stat strong{color:#7353d6}
    .stage{position:relative;width:100%;aspect-ratio:3/2;overflow:hidden;border-radius:18px;background:var(--field);box-shadow:inset 0 0 0 2px #ffffffa8;touch-action:none}.stage canvas{display:block;width:100%;height:100%;cursor:crosshair}.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:20px;background:#263f3370;transition:opacity .18s}.overlay[hidden]{display:none}.panel{max-width:410px;text-align:center;border:3px solid #fff;border-radius:22px;padding:22px 24px;background:#fff9;box-shadow:0 12px 30px #24372b4a;backdrop-filter:blur(5px)}.panel h2{margin:0 0 8px;font-size:1.65rem}.panel p{margin:6px auto 16px;line-height:1.45;font-size:.96rem}.controls{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
    button{appearance:none;border:0;border-radius:999px;padding:10px 16px;background:var(--accent);color:white;font:inherit;font-weight:850;cursor:pointer;box-shadow:0 3px 0 var(--accent-dark);min-height:42px}button:hover{filter:brightness(.92)}button:focus-visible{outline:3px solid #ffe26f;outline-offset:3px}button.secondary{background:#fff;color:var(--accent);border:2px solid var(--accent);box-shadow:none}.bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 3px 0}.hint{margin:0;font-size:.78rem;line-height:1.35;color:#486252}.pause{padding:7px 13px;min-height:34px;font-size:.8rem}.made-with{margin:0 auto 0 0;font-size:.69rem;line-height:1.3;color:#627b6b}.made-with a{color:inherit;text-decoration:underline;text-underline-offset:2px}.made-with a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}.sr-status{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:540px){body{padding:0;place-items:stretch}.game-shell{border-radius:0;border:0;padding:10px;min-height:100vh}.topbar{align-items:flex-start}.brand-mark{font-size:1.35rem}.stats{gap:4px}.stat{padding:5px 8px;font-size:.74rem}.overlay{display:block;overflow-y:auto;padding:8px;overscroll-behavior:contain}.panel{width:100%;padding:12px 14px;margin:0 auto}.panel h2{margin-bottom:5px;font-size:1.25rem}.panel p{margin:4px auto 10px;font-size:.84rem;line-height:1.3}.panel button{min-height:36px;padding:7px 12px}.bottom{align-items:flex-start;flex-direction:column}.made-with{margin:0;font-size:.66rem}.pause{align-self:flex-end;margin-top:0}}
    @media(prefers-reduced-motion:reduce){.overlay{transition:none}}
  </style>
</head>
<body>
  <main class="game-shell" aria-labelledby="game-title">
    <header class="topbar"><div class="brand"><div class="brand-mark" aria-hidden="true">🍓</div><div><h1 id="game-title"></h1><div class="sub">A tiny collect-and-dodge meadow run</div></div></div><div class="stats" aria-label="Game status"><span class="stat">Collected <strong id="score">0 / —</strong></span><span class="stat">Lives <strong id="lives">—</strong></span><span class="stat">Time <strong id="time">—</strong></span></div></header>
    <section class="stage" aria-label="Game area"><canvas id="game" width="900" height="600" aria-label="Play area. Use arrow keys or WASD, or drag on the meadow to move."></canvas><div class="overlay" id="overlay"><div class="panel"><h2 id="overlay-title">Ready to play</h2><p id="overlay-copy">Load the meadow run to see its goal and controls.</p><div class="controls"><button id="primary" type="button" aria-label="Start game">Start meadow run</button><button id="how-to" class="secondary" type="button">How to play</button></div></div></div></section>
    <footer class="bottom"><p class="hint" id="hint">Move: Arrow keys / WASD · Or drag in the meadow</p><p class="made-with">Made with <a href="https://opengame.app/?utm_source=opengame-skill&amp;utm_medium=plugin&amp;utm_campaign=offline-arcade" target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer">OpenGame AI Game Generator</a> · <a href="https://opengame.app/showcase?utm_source=opengame-skill&amp;utm_medium=plugin&amp;utm_campaign=offline-arcade" target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer">Game examples</a></p><button id="pause" class="secondary pause" type="button">Pause</button></footer>
    <p id="sr-status" class="sr-status" aria-live="polite"></p>
  </main>
  <script id="opengame-config" type="application/json">__OPENGAME_CONFIG_JSON__</script>
  <script id="opengame-assets" type="application/json">__OPENGAME_ASSETS_JSON__</script>
  <script>
  (() => {
    'use strict';
    const WORLD = { width: 900, height: 600 };
    const defaultConfig = { schema:'opengame.arcade.v1', title:'Starberry Meadow', goal:8, roundSeconds:60, playerSpeed:220, hazardSpeed:85, hazardCount:3, maxLives:3, collectible:'star', seed:1729, palette:{sky:'#e7f7ef',field:'#bde3b0',accent:'#7353d6'} };
    function jsonFrom(id, fallback) { try { const parsed = JSON.parse(document.getElementById(id).textContent); return parsed && typeof parsed === 'object' ? parsed : fallback; } catch (_) { return fallback; } }
    const supplied = jsonFrom('opengame-config', {});
    const config = { ...defaultConfig, ...supplied, palette:{...defaultConfig.palette,...(supplied.palette || {})} };
    function wholeAtLeast(value, fallback, minimum) { const number=Number(value); return Number.isFinite(number) ? Math.max(minimum,Math.floor(number)) : fallback; }
    config.goal=wholeAtLeast(config.goal,defaultConfig.goal,1); config.roundSeconds=wholeAtLeast(config.roundSeconds,defaultConfig.roundSeconds,1); config.maxLives=wholeAtLeast(config.maxLives,defaultConfig.maxLives,1); config.hazardCount=wholeAtLeast(config.hazardCount,defaultConfig.hazardCount,0);
    const title=String(config.title || defaultConfig.title), collectibleLabel=config.collectible==='gem'?'gems':'stars', collectibleSingular=config.collectible==='gem'?'Gem':'Star', introCopy=`Gather ${config.goal} sparkling ${collectibleLabel} while dodging grumpy tumblepuffs. You have ${config.maxLives} heart${config.maxLives===1?'':'s'} and ${config.roundSeconds} second${config.roundSeconds===1?'':'s'}.`;
    const assets = jsonFrom('opengame-assets', {});
    const canvas = document.getElementById('game'), ctx = canvas.getContext('2d');
    const ui = { title:document.getElementById('game-title'), score:document.getElementById('score'), lives:document.getElementById('lives'), time:document.getElementById('time'), stage:document.querySelector('.stage'), hint:document.getElementById('hint'), overlay:document.getElementById('overlay'), overlayTitle:document.getElementById('overlay-title'), overlayCopy:document.getElementById('overlay-copy'), primary:document.getElementById('primary'), howTo:document.getElementById('how-to'), pause:document.getElementById('pause'), status:document.getElementById('sr-status') };
    ui.title.textContent = title; document.title = title; ui.stage.setAttribute('aria-label',`${title} game area`); ui.hint.textContent=`Move: Arrow keys / WASD · Or drag in the meadow · Gather ${config.goal} ${collectibleLabel} before ${config.roundSeconds} seconds run out`;
    document.documentElement.style.setProperty('--sky',config.palette.sky); document.documentElement.style.setProperty('--field',config.palette.field); document.documentElement.style.setProperty('--accent',config.palette.accent); document.documentElement.style.setProperty('--accent-dark',config.palette.accent);
    const images = {};
    Object.keys(assets).forEach((key) => { if (typeof assets[key] === 'string' && assets[key]) { const image = new Image(); image.src = assets[key]; images[key] = image; } });
    let random, state, lastFrame = 0, pointerTarget = null, pointerActive = false;
    const keys = new Set();
    function makeRandom(seed) { const number=Number(seed); let value=Number.isFinite(number) ? (number>>>0) : defaultConfig.seed; return () => { value = (value * 1664525 + 1013904223) >>> 0; return value / 4294967296; }; }
    function range(min,max) { return min + random() * (max - min); }
    function clearInput() { keys.clear(); pointerActive=false; pointerTarget=null; }
    function reset() { clearInput(); random = makeRandom(config.seed); state = { phase:'intro', score:0, lives:config.maxLives, timeLeft:config.roundSeconds, player:{x:135,y:310,radius:30,invulnerable:0,frame:0}, pickups:[], hazards:[], elapsed:0 }; spawnPickups(3); for(let i=0;i<config.hazardCount;i++) state.hazards.push(makeHazard(i)); updateUi(); }
    function makeHazard(index) { const side = index % 2 ? -1 : 1; return { x:range(310,850), y:range(100,520), radius:29, vx:side * range(.72,1.15) * Number(config.hazardSpeed||85), vy:range(-.5,.5) * Number(config.hazardSpeed||85), bob:range(0,Math.PI*2) }; }
    function spawnPickups(count) { while(state.pickups.length < count && state.score + state.pickups.length < Number(config.goal)) { let candidate, okay = false; for(let tries=0;tries<60&&!okay;tries++){ candidate={x:range(140,825),y:range(105,500),radius:21,spin:range(0,Math.PI*2)}; okay=Math.hypot(candidate.x-state.player.x,candidate.y-state.player.y)>130 && state.pickups.every(p=>Math.hypot(p.x-candidate.x,p.y-candidate.y)>80); } if(okay) state.pickups.push(candidate); else break; } }
    function start() { reset(); state.phase='running'; ui.overlay.hidden=true; ui.pause.textContent='Pause'; announce(`${title} started. Collect ${config.goal} ${collectibleLabel} in ${config.roundSeconds} seconds.`); }
    function setOverlay(title, copy, action) { ui.overlayTitle.textContent=title; ui.overlayCopy.textContent=copy; ui.primary.textContent=action; ui.primary.setAttribute('aria-label',action); ui.overlay.hidden=false; }
    function pause(auto) { if(state.phase!=='running') return; clearInput(); state.phase='paused'; setOverlay(auto?'Taking a breath':'Paused',`${title} is safely paused. Press resume whenever you are ready.`,'Resume'); ui.pause.textContent='Resume'; announce(`${title} paused.`); }
    function resume() { if(state.phase==='paused'){ state.phase='running'; ui.overlay.hidden=true; ui.pause.textContent='Pause'; lastFrame=performance.now(); announce('Game resumed.'); } else start(); }
    function finish(won) { state.phase=won?'won':'lost'; const copy=won ? `You gathered all ${config.goal} ${collectibleLabel} with ${state.lives} heart${state.lives===1?'':'s'} left!` : state.lives<=0 ? 'The tumblepuffs got you this time. Shake off the petals and try again.' : `Time is up! You gathered ${state.score} of ${config.goal} ${collectibleLabel}.`; setOverlay(won?'Meadow magic!':'Run over',copy,'Play again'); ui.pause.textContent='Pause'; announce(won?`You won ${title}.`:'Game over.'); }
    function updateUi() { ui.score.textContent=`${state.score} / ${config.goal}`; ui.lives.textContent=Array.from({length:Math.max(0,state.lives)},()=> '♥').join(' ') || '—'; ui.time.textContent=Math.max(0,Math.ceil(state.timeLeft)).toString(); }
    function announce(message) { ui.status.textContent=message; }
    function clamp(value,min,max){return Math.max(min,Math.min(max,value));}
    function update(dt) { if(state.phase!=='running') return; state.elapsed+=dt; state.timeLeft-=dt; const p=state.player; p.invulnerable=Math.max(0,p.invulnerable-dt); let x=(keys.has('arrowright')||keys.has('d')?1:0)-(keys.has('arrowleft')||keys.has('a')?1:0); let y=(keys.has('arrowdown')||keys.has('s')?1:0)-(keys.has('arrowup')||keys.has('w')?1:0); if(pointerTarget){ const dx=pointerTarget.x-p.x,dy=pointerTarget.y-p.y,d=Math.hypot(dx,dy); if(d>5){x=dx/d;y=dy/d;}else if(!pointerActive) pointerTarget=null; } const moving=x||y; if(moving){ const length=Math.hypot(x,y); p.x=clamp(p.x+x/length*Number(config.playerSpeed||220)*dt,p.radius,WORLD.width-p.radius); p.y=clamp(p.y+y/length*Number(config.playerSpeed||220)*dt,p.radius,WORLD.height-p.radius); p.frame+=dt*10; }
      for(const h of state.hazards){h.x+=h.vx*dt;h.y+=h.vy*dt;h.bob+=dt*3; if(h.x<h.radius||h.x>WORLD.width-h.radius)h.vx*=-1;if(h.y<h.radius||h.y>WORLD.height-h.radius)h.vy*=-1;h.x=clamp(h.x,h.radius,WORLD.width-h.radius);h.y=clamp(h.y,h.radius,WORLD.height-h.radius); if(p.invulnerable<=0&&Math.hypot(p.x-h.x,p.y-h.y)<p.radius+h.radius-7){state.lives--;p.invulnerable=1.25;p.x=135;p.y=310;announce(`Ouch! ${state.lives} ${state.lives===1?'heart':'hearts'} left.`);if(state.lives<=0){finish(false);updateUi();return;}}}
      for(let i=state.pickups.length-1;i>=0;i--){const item=state.pickups[i];item.spin+=dt*4;if(Math.hypot(p.x-item.x,p.y-item.y)<p.radius+item.radius-5){state.pickups.splice(i,1);state.score++;announce(`${collectibleSingular} collected: ${state.score} of ${config.goal}.`);if(state.score>=config.goal){finish(true);break;}spawnPickups(3);}}
      if(state.phase==='running'&&state.timeLeft<=0)finish(false); updateUi(); }
    function drawImage(id,x,y,w,h,rotation=0,alpha=1){const img=images[id];ctx.save();ctx.globalAlpha=alpha;ctx.translate(x,y);ctx.rotate(rotation);if(img&&img.complete&&img.naturalWidth)ctx.drawImage(img,-w/2,-h/2,w,h);else fallback(id,w,h);ctx.restore();}
    function fallback(id,w,h){ if(id==='star'||id==='gem'){ctx.fillStyle=id==='gem'?'#61d9cf':'#ffe26f';ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?Math.min(w,h)*.23:Math.min(w,h)*.48;const px=Math.cos(a)*r,py=Math.sin(a)*r;i?ctx.lineTo(px,py):ctx.moveTo(px,py);}ctx.fill();}else{ctx.fillStyle=id==='hazard'?'#e98d5d':'#7353d6';ctx.beginPath();ctx.arc(0,0,Math.min(w,h)*.38,0,Math.PI*2);ctx.fill();} }
    function drawBackground(){const suppliedBackground=images.background;if(suppliedBackground&&suppliedBackground.complete&&suppliedBackground.naturalWidth){ctx.drawImage(suppliedBackground,0,0,WORLD.width,WORLD.height);ctx.save();ctx.globalAlpha=.18;ctx.fillStyle=config.palette.sky;ctx.fillRect(0,0,WORLD.width,WORLD.height);ctx.globalAlpha=.22;ctx.fillStyle=config.palette.field;ctx.fillRect(0,WORLD.height*.48,WORLD.width,WORLD.height*.52);ctx.restore();return;}const g=ctx.createLinearGradient(0,0,0,WORLD.height);g.addColorStop(0,config.palette.sky);g.addColorStop(1,'#c9ecdc');ctx.fillStyle=g;ctx.fillRect(0,0,WORLD.width,WORLD.height);ctx.fillStyle='#fff6b0';ctx.beginPath();ctx.arc(745,90,48,0,Math.PI*2);ctx.fill();ctx.fillStyle='#a4d69e';ctx.beginPath();ctx.moveTo(0,265);for(let x=0;x<=WORLD.width;x+=90)ctx.quadraticCurveTo(x+45,210+(x%180?25:0),x+90,266);ctx.lineTo(WORLD.width,WORLD.height);ctx.lineTo(0,WORLD.height);ctx.fill();const field=ctx.createLinearGradient(0,300,0,600);field.addColorStop(0,config.palette.field);field.addColorStop(1,'#8fc990');ctx.fillStyle=field;ctx.beginPath();ctx.moveTo(0,328);for(let x=0;x<=WORLD.width;x+=90)ctx.quadraticCurveTo(x+45,280+(x%180?25:0),x+90,330);ctx.lineTo(WORLD.width,WORLD.height);ctx.lineTo(0,WORLD.height);ctx.fill();for(let i=0;i<23;i++){const x=(i*127)%900,y=388+(i*71)%195;ctx.strokeStyle='#77b578';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,y+13);ctx.lineTo(x+((i%3)-1)*5,y);ctx.stroke();}}
    function draw(){drawBackground(); state.pickups.forEach(p=>{ctx.save();ctx.globalAlpha=.2;ctx.fillStyle=config.palette.accent;ctx.beginPath();ctx.ellipse(p.x,p.y+25,20,5,0,0,Math.PI*2);ctx.fill();ctx.restore();drawImage(config.collectible==='gem'?'gem':'star',p.x,p.y+Math.sin(p.spin)*4,48,48,p.spin*.15);});state.hazards.forEach(h=>drawImage('hazard',h.x,h.y+Math.sin(h.bob)*3,72,72,Math.sin(h.bob)*.08));const p=state.player,visible=p.invulnerable<=0||Math.floor(p.invulnerable*12)%2===0; if(visible){const moving=keys.size||pointerTarget;const sprite=moving?(Math.floor(p.frame)%2?'player_move_1':'player_move_2'):'player_idle';drawImage(sprite,p.x,p.y,96,96);}if(state.phase==='paused'){ctx.fillStyle='#24372b33';ctx.fillRect(0,0,WORLD.width,WORLD.height);}}
    function frame(now){const dt=Math.min(.05,(now-lastFrame)/1000||0);lastFrame=now;update(dt);draw();requestAnimationFrame(frame);}
    function pointerPosition(event){const rect=canvas.getBoundingClientRect();return{x:clamp((event.clientX-rect.left)*WORLD.width/rect.width,0,WORLD.width),y:clamp((event.clientY-rect.top)*WORLD.height/rect.height,0,WORLD.height)};}
    window.addEventListener('keydown',event=>{const key=event.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d'].includes(key)){keys.add(key);event.preventDefault();}if((key==='escape'||key==='p')&&!event.repeat){event.preventDefault();if(state.phase==='running')pause(false);else if(state.phase==='paused')resume();}});
    window.addEventListener('keyup',event=>keys.delete(event.key.toLowerCase())); window.addEventListener('blur',()=>{clearInput();pause(true);}); document.addEventListener('visibilitychange',()=>{if(document.hidden){clearInput();pause(true);}});
    canvas.addEventListener('pointerdown',event=>{if(state.phase==='running'){pointerActive=true;pointerTarget=pointerPosition(event);canvas.setPointerCapture(event.pointerId);event.preventDefault();}});canvas.addEventListener('pointermove',event=>{if(pointerActive){pointerTarget=pointerPosition(event);event.preventDefault();}});canvas.addEventListener('pointerup',()=>{pointerActive=false;});canvas.addEventListener('pointercancel',()=>{pointerActive=false;pointerTarget=null;});
    ui.primary.addEventListener('click',()=>state.phase==='paused'?resume():start()); ui.pause.addEventListener('click',()=>state.phase==='running'?pause(false):resume()); ui.howTo.addEventListener('click',()=>{ui.overlayTitle.textContent='How to play';ui.overlayCopy.textContent=`Guide the meadow sprite into each sparkling ${config.collectible==='gem'?'gem':'star'}. Arrow keys or WASD move on a keyboard; on touch screens, press and drag in the meadow. Avoid tumblepuffs, pause with P or Escape, and collect ${config.goal} ${collectibleLabel} before ${config.roundSeconds} seconds run out.`;const action=state.phase==='paused'?'Resume':'Start meadow run';ui.primary.textContent=action;ui.primary.setAttribute('aria-label',action);});
    window.render_game_to_text=()=>JSON.stringify({phase:state.phase,score:state.score,lives:state.lives,timeLeft:Number(state.timeLeft.toFixed(2)),player:{x:Number(state.player.x.toFixed(2)),y:Number(state.player.y.toFixed(2)),radius:state.player.radius},pickups:state.pickups.map(p=>({x:Number(p.x.toFixed(2)),y:Number(p.y.toFixed(2)),radius:p.radius})),hazards:state.hazards.map(h=>({x:Number(h.x.toFixed(2)),y:Number(h.y.toFixed(2)),radius:h.radius})),world:WORLD});
    reset(); setOverlay(title,introCopy,'Start meadow run'); requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
